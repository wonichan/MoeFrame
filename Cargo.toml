[package]
name = "moe_frame"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "window-validation"
path = "src/bin/window-validation.rs"

[dependencies]
# eframe/egui 是需求文档 8.3 的 GUI 类别。下面三个直接依赖超出 8.3 清单，仅为工单 08 的
# 独立窗口验证程序读取原生窗口状态；正式相框如不需要实机 Win32 观测，应删除它们。
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts"] }
# winit 用于在 CreationContext 中获取原生窗口（关闭无装饰阴影、判断最大化/全屏）。
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
# raw-window-handle/windows-sys 只服务诊断日志的 Win32 观测：客户区、DPI 感知、窗口样式、前台窗口。
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
