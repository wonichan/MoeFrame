[package]
name = "moe_frame"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "window-validation"
path = "src/bin/window-validation.rs"

[[bin]]
name = "decode-validation"
path = "src/bin/decode-validation.rs"

[[bin]]
name = "MoeFrame"
path = "src/bin/moe-frame.rs"
[dependencies]
# eframe/egui 是需求文档 8.3 的 GUI 类别。下面三个直接依赖超出 8.3 清单，仅为工单 08 的
# 独立窗口验证程序读取原生窗口状态；正式相框如不需要实机 Win32 观测，应删除它们。
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
# image 服务工单 09 的解码验证与正式相框（工单 10 起）。默认关闭输入/输出以外的编解码能力，
# 保留产品要求的格式；gif 仅取第一帧，不实现动图播放。
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# 以下为需求文档 8.3 列出的类别：toml_edit（配置序列化，编辑式保留手改与未知键）、
# walkdir（目录遍历）、rfd（文件夹选择框，仅正式相框二进制使用）、rand（随机播放序列）。
toml_edit = "=0.22.27"
walkdir = "=2.5.0"
# open（需求文档 8.3 类别）：工单 15 起用系统默认看图器打开原图、打开所在文件夹。
open = "=5.4.5"
rfd = "=0.15.4"
rand = "=0.10.4"

[target.'cfg(windows)'.dependencies]
# tray-icon（需求文档 8.3 类别）：工单 17 起托盘常驻、托盘菜单与左键切换显示；仅正式相框用，门控在 Windows。
tray-icon = "=0.21.3"
# winreg（需求文档 8.3 类别）：工单 21 起读写当前用户 Run 自启项；仅宿主用，门控在 Windows。
winreg = "=0.55.0"
# raw-window-handle/windows-sys 只服务诊断日志的 Win32 观测：客户区、DPI 感知、窗口样式、前台窗口、
# 以及工单 09 的进程内存采样（GetProcessMemoryInfo）。
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Wdk_System_SystemServices"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
