# target/debug/incremental 在 Windows 上收尾时会偶发「拒绝访问 (os error 5)」，
# 每次构建刷一行与代码无关的伪错误。关掉 dev/test 增量编译，换干净的构建日志；
# release 本来就不做增量。CI 由 scripts/check.sh 再显式设一次 CARGO_INCREMENTAL=0。
[profile.dev]
incremental = false

[profile.test]
incremental = false
# 交付形态是"单个 exe 拷到任何机器就能跑"：静态链接 MSVC CRT，
# 否则 exe 依赖 VCRUNTIME140.dll / api-ms-win-crt-*（需装 VC++ 可再发行组件）。
# 只对 Windows 目标生效，不影响 Linux 上的测试副本。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
