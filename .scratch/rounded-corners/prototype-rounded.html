<!DOCTYPE html>
<!-- PROTOTYPE（抛弃式）：内置画框圆角方案预览。四变体经底部切换条以 ?variant= 切换。
     问题：圆角半径方案哪种观感对——A 直角现状 / B 共识 10·4·6 / C 更圆润 20·10·12 / D 只圆外角 16·0·0。
     绘制为 CSS 近似（非程序真实渲染）：框体渐变+内阴影模拟截面，卡纸与画面细影同理。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background:#20242c; }
  .scene {
    position: relative; min-height: 640px; padding: 34px 16px 92px;
    background:
      radial-gradient(120% 90% at 20% 0%, #ffe9f2 0%, transparent 55%),
      radial-gradient(100% 80% at 90% 100%, #bfe3ff 0%, transparent 50%),
      linear-gradient(160deg, #f7c9d9 0%, #a8c8ec 55%, #7fb0dd 100%);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .badge {
    position: absolute; top: 10px; left: 12px; font-size: 12px; color: #fff;
    background: rgba(20,20,30,.55); padding: 4px 10px; border-radius: 999px; letter-spacing: .04em;
  }
  .frame-body {
    background: linear-gradient(145deg, #8a5f36, #6b4423 45%, #59371c 75%, #77552e);
    box-shadow:
      inset 0 0 0 2px rgba(25,15,5,.6),
      inset 0 2px 2px rgba(255,220,170,.35),
      inset 0 -3px 5px rgba(0,0,0,.45),
      inset 2px 0 3px rgba(255,220,170,.16),
      inset -2px 0 3px rgba(0,0,0,.3),
      0 10px 28px rgba(30,20,40,.35);
  }
  .mat {
    background: #f6f0e0;
    box-shadow:
      inset 0 3px 8px rgba(74,50,20,.45),
      inset 3px 0 6px rgba(74,50,20,.26),
      inset -3px 0 6px rgba(74,50,20,.26),
      inset 0 -3px 6px rgba(74,50,20,.30);
  }
  .imgwrap { position: relative; overflow: hidden; background:#ddd; }
  .imgwrap img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .imgshade {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.75),
      inset 0 2px 9px rgba(60,40,15,.35),
      inset 0 0 16px rgba(60,40,15,.16);
  }
  .controls {
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.75); padding: 8px 16px; border-radius: 12px; font-size: 13px; color:#333;
  }
  .controls input[type=range] { width: 110px; vertical-align: middle; }
  .state { font-size: 13px; color: #26303c; background: rgba(255,255,255,.6); padding: 5px 12px; border-radius: 999px; }
  .switcher {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    background: #14161c; color: #f2f3f5; border-radius: 999px; padding: 8px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); font-size: 14px; user-select: none;
  }
  .switcher button {
    border: 0; background: #2a2e38; color: #fff; width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; cursor: pointer; line-height: 1;
  }
  .switcher button:hover { background: #3a3f4d; }
  .switcher .vlabel { min-width: 190px; text-align: center; }
</style>
</head>
<body>
<div class="scene">
  <div class="badge">原型 · 圆角预览（CSS 近似，非程序截图）</div>
  <div id="stage"></div>
  <div class="controls">
    <label>框宽 <input id="fw" type="range" min="0" max="40" value="14"> <span id="fwv">14</span></label>
    <label>卡纸宽 <input id="mw" type="range" min="0" max="40" value="18"> <span id="mwv">18</span></label>
  </div>
  <div class="state" id="state"></div>
  <div class="switcher">
    <button id="prev" title="上一个（←）">←</button>
    <div class="vlabel" id="vlabel"></div>
    <button id="next" title="下一个（→）">→</button>
  </div>
</div>

  const VARIANTS = [
    { key: "A", name: "直角现状",     r: [0, 0, 0] },
    { key: "B", name: "共识方案",     r: [10, 4, 6] },
    { key: "C", name: "更圆润",       r: [20, 10, 12] },
    { key: "D", name: "只圆外角",     r: [16, 0, 0] },
  ];
  const IMG_W = 300, IMG_H = Math.round(300 * 517 / 366);
  let vi = 1; // 默认 B 共识方案
  try {
    const p = new URLSearchParams(location.search).get("variant");
    const i = VARIANTS.findIndex(v => v.key === p);
    if (i >= 0) vi = i;
  } catch (e) {}
  const $ = id => document.getElementById(id);
  function render() {
    const v = VARIANTS[vi];
    const fw = +$("fw").value, mw = +$("mw").value;
    $("fwv").textContent = fw; $("mwv").textContent = mw;
    const inset = fw + mw;
    const clamp = (r, cap) => Math.max(0, Math.min(r, cap));
    // 夹紧口径（spec）：半径不超过所在带厚度可达范围与窗口半宽
    const rO  = inset === 0 ? 0 : clamp(v.r[0], Math.max(inset, v.r[0] === 0 ? 0 : 1));
    const rFI = fw > 0 ? clamp(v.r[1], Math.max(fw, 1)) : rO;
    const rMI = inset === 0 ? 0 : v.r[2];
    const matRadius = fw > 0 ? rFI : rO;
    const imgRadius = mw > 0 || fw > 0 ? rMI : 0;
    $("stage").innerHTML =
      '<div class="frame-body" style="border-radius:' + rO + 'px;padding:' + fw + 'px">' +
        '<div class="mat" style="border-radius:' + matRadius + 'px;padding:' + mw + 'px">' +
          '<div class="imgwrap" style="border-radius:' + imgRadius + 'px;width:' + IMG_W + 'px;height:' + IMG_H + 'px">' +
            '<img src="' + ILLUS + '" alt="">' +
            '<div class="imgshade" style="border-radius:' + imgRadius + 'px"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    $("vlabel").textContent = v.key + " · " + v.name;
    $("state").textContent =
      "生效半径 外 " + rO + " / 框内 " + (fw > 0 ? rFI : "—") + " / 卡纸内 " + imgRadius +

    try { history.replaceState(null, "", "?variant=" + v.key); } catch (e) {}
  }
  function step(d) { vi = (vi + d + VARIANTS.length) % VARIANTS.length; render(); }
  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  $("fw").oninput = render; $("mw").oninput = render;
  document.addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
  render();
